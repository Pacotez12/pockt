name: pockt
description: "Pockt - Finanzas personales"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  drift: 2.35.2
  drift_flutter: 0.3.1
  flutter_riverpod: 3.4.3
  riverpod_annotation: 4.0.7
  intl: 0.20.3
  uuid: 4.6.0
  timezone: 0.11.1
  flutter_timezone: 5.1.1
  phosphor_flutter: 2.1.0
  flutter_local_notifications: 22.3.1
  workmanager: 0.10.10
  home_widget: 0.10.0
  cryptography: 2.9.0
  flutter_secure_storage: 11.2.0
  google_sign_in: 7.2.0
  googleapis: 17.0.0
  extension_google_sign_in_as_googleapis_auth: 3.0.0
  sqlite3: 3.5.2
  path_provider: 2.1.6
  local_auth: 3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: 2.35.1
  build_runner: 2.16.2
  riverpod_generator: 4.0.9
  mocktail: 1.0.5
  http: 1.6.0

dependency_overrides:
  # Copia local de phosphor_flutter 2.1.0 (MIT) con el ajuste de compatibilidad
  # para Flutter >= 3.44; el paquete oficial no se publica desde 2024.
  phosphor_flutter:
    path: packages/phosphor_flutter

flutter:
  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
