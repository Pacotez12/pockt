name: pockt
description: "Pockt - Finanzas personales"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  drift: 2.35.2
  drift_flutter: 0.3.1
  flutter_riverpod: 3.4.3
  riverpod_annotation: 4.0.7
  intl: 0.20.3
  uuid: 4.6.0
  timezone: 0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: 2.35.1
  build_runner: 2.16.2
  riverpod_generator: 4.0.9
  mocktail: 1.0.5

flutter:
  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
